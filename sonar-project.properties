sonar.organization=abh5227     
sonar.projectKey=abh5227_recipe-app    

sonar.sources=app.py,build_db.py,migrate.py,seed.py,backup.py,static
sonar.tests=tests
sonar.python.version=3.12            
sonar.python.coverage.reportPaths=coverage.xml
# tests/fixtures/pages/** — the 14 captured recipe pages U0 committed. They are third-party HTML we
# did not write, cannot change, and must not change: they are byte-exact captures whose fidelity IS
# their purpose, and every reader stage is tested against them. Analysing them reported 356 issues
# (bugs, smells and vulnerabilities) against other people's inline analytics scripts — 2.5x this
# project's real issue count, none of it actionable. Excluded via BOTH properties on purpose:
# sonar.exclusions governs MAIN sources, but these files live under sonar.tests, so
# sonar.test.exclusions is the one that actually applies to them. Do not remove either line.
sonar.exclusions=**/recipes.db,**/__pycache__/**,tests/fixtures/pages/**
sonar.test.exclusions=tests/fixtures/pages/**
