name: SonarQube
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    # Ephemeral Postgres for the dialect-divergence suite (Stage 2c-3). Job-scoped, health-gated so
    # steps don't run until it's ready. trust auth (no password) — idiomatic for a throwaway,
    # localhost-only CI service that's destroyed at job end, and leaves no credential to hardcode.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: recipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so issues map to commits
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests with coverage
        run: |
          pip install -r requirements.txt -r requirements-dev.txt pytest-cov
          pytest --cov=. --cov-report=xml     # writes coverage.xml
      # SQLite run above (DATABASE_URL unset -> SQLite; the PG suite skips). PG run below: DATABASE_URL
      # is scoped to THIS step only, so the SQLite run stays clean. Dual-dialect CI.
      - name: Run Postgres integration tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/recipe_test
          # A Postgres DATABASE_URL makes app.py FAIL CLOSED without SECRET_KEY (docs/SECURITY.md), so
          # this step MUST supply one. This is a throwaway CI value, NOT a real/production secret.
          SECRET_KEY: ci-only-not-a-real-secret
        run: |
          alembic upgrade head                  # create the schema on the CI Postgres service
          pytest tests/test_pg_integration.py --junitxml=/tmp/pg-results.xml
          # SELF-PROVING GUARD. The whole module skips on ONE module-level pytestmark (DATABASE_URL not
          # postgresql), so it is 20-or-0 and never partial — and an all-skipped run EXITS 0, making a
          # silent skip indistinguishable from a pass in the step's green check. This asserts that at
          # least one test actually RAN. Deliberately not an exact count: pinning a number would need
          # editing every time a PG test is added, and the failure mode being guarded is "nothing ran",
          # not "the wrong number ran". Zero-collected also lands here (tests=0 -> ran=0).
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ts = ET.parse("/tmp/pg-results.xml").getroot().find("testsuite")
          total, skipped = int(ts.get("tests")), int(ts.get("skipped"))
          ran = total - skipped
          print(f"Postgres suite: {total} collected, {skipped} skipped, {ran} actually ran")
          if ran == 0:
              raise SystemExit("FAIL: the Postgres suite ran NO tests — it skipped silently, which "
                               "exits 0 and is indistinguishable from a pass. Check DATABASE_URL.")
          PY
      - uses: actions/setup-node@v4
        with:
          # Pinned ON PURPOSE, and pinned CURRENT: Node 20 went EOL 2026-04-30. This job answers
          # "does the suite still pass on the version we support", so it wants a fixed version —
          # the cold-start job is the one that tracks `latest` to stand in for a stranger's machine.
          node-version: "24"
      - name: Run JS tests
        run: node --test tests/js/*.test.js   # client-side scaler/converter + factor-sync
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5   # check the Marketplace for the current version
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
